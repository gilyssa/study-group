<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="../assets/favicon-code-queens.ico type=" type="image/x-icon">
    <title>Cadastrar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap">
</head>

<body>
    <main>
        <div class="queens">
            <img src="../assets/queenLogo.svg" alt="icone" class="icone">
            <p>Empoderando mulheres na tecnologia</p>
        </div>

        <div class="cadastro">
            <h2>Cadastro</h2>
            <div>
                <label for="email">Nome completo</label>
                <input type="email" id="email" placeholder="seuemail@email.com">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seuemail@email.com">
            </div>

            <div class="senha">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="***********">
                <img src="img/eyeOff.svg" alt="icone" id="showPassword">
            </div>

            <div class="senha">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" placeholder="***********">
                <img src="img/eyeOff.svg" alt="icone" id="showPassword2">
            </div>

            <section class="login">
                <a class="btn" href="/home/index.html">Entrar</a>

                <p>Já tem uma conta? <a href="../login/login.html">Faça login aqui</a>
                </p>
            </section>
        </div>


    </main>

    <script src="./script.js"></script>
</body>

</html>
